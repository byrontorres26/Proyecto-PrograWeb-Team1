<mat-card class="denuncias">

  <mat-card-header>
    <mat-card-title>
      Mis Denuncias
    </mat-card-title>
  </mat-card-header>

  <button
    mat-raised-button
    color="primary"
    (click)="cargarDenuncias()">

    Actualizar Denuncias

  </button>

  <br><br>

  <div *ngFor="let denuncia of denuncias">

    <mat-card class="denuncia-card">

      <mat-card-header>
        <mat-card-title>
          {{ denuncia.title }}
        </mat-card-title>
      </mat-card-header>

      <mat-card-content>

        <p>
          <strong>Estado:</strong>
          {{ denuncia.status }}
        </p>

        <p>
          <strong>Categoría:</strong>
          {{ denuncia.categoria }}
        </p>

        <p>
          <strong>Reportado:</strong>
          {{ denuncia.userreport }}
        </p>

        <p>
          {{ denuncia.comment }}
        </p>

      </mat-card-content>

    </mat-card>

    <br>

  </div>
  <!--ESTA PARTE ES DEL FORMS QUE SE ABRE-->

  <button
    class="button"
    mat-raised-button
    color="primary"
    (click)="mostrarforms()">
    Quiero Denunciar


  </button>

</mat-card>

<div class="overlay" *ngIf="mostrarFormulario">

  <mat-card class="popup">

    <h2>Crear Denuncia</h2>
    <div class = form>
    <input 
      type="text"
      placeholder="Título"
      [(ngModel)]="title">

    <textarea
      placeholder="Comentario"
      [(ngModel)]="comment">
    </textarea>
 

    <input
      type="text"
      placeholder="Usuario reportado"
      [(ngModel)]="userreport">
      
    </div>

     <mat-label>Categoría</mat-label>
    <mat-form-field appearance="outline">
 <mat-label>Selecciona</mat-label>     
<mat-select [(ngModel)]="categoria" name="categoria">
  <mat-option
    *ngFor="let c of categorias"
    [value]="c.value">

    {{ c.label }}

  </mat-option>
</mat-select>
</mat-form-field>
    
    <button
        mat-button 
        (click)="mostrarFormulario = false" class="cancel">

        Cancelar

     </button>

      <button
        mat-raised-button class="acciones"
        (click)="crearDenuncia()">

        Crear

      </button>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
        

   

  </mat-card>

</div>
